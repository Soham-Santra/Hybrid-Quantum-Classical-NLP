# =============================================================================
# Experiment Config: Data Augmentation
# =============================================================================
# Merged on top of default.yaml when running:
#   python run.py --experiment augmentation --exp-config augmentation

embeddings:
  method: "tfidf"

augmentation:
  enabled: true
  methods:
    back_translation:
      enabled: true
      num_augmented: 2
    synonym_replacement:
      enabled: true
      num_replacements: 2
      num_augmented: 2
    contextual:
      enabled: true
      mask_ratio: 0.15
      num_augmented: 2
  target_fractions: [0.05, 0.1, 0.25]

low_resource:
  enabled: true
  fractions: [0.05, 0.1, 0.25]
  stratified: true

memory:
  enabled: false
